server:
  port: 8080
  app_env: "[APP_ENV]"
database:
  name: "[IDENTITY_POSTGRES_DB_NAME]"
  database: "[IDENTITY_POSTGRES_DB_NAME]"
  host: "[IDENTITY_POSTGRES_DB_HOST]"
  port: "[IDENTITY_POSTGRES_DB_PORT]"
  user: "[IDENTITY_POSTGRES_DB_USER]"
  password: "[IDENTITY_POSTGRES_DB_PASSWORD]"
  ssl_mode: "[IDENTITY_POSTGRES_DB_SSL_MODE]"
security:
  jwt:
    secret: "[IDENTITY_JWT_SECRET]"
    refresh_secret: "[IDENTITY_JWT_REFRESH_SECRET]"
    encryption_key: "[JWT_ENCRYPTION_KEY]"
    access_ttl: "[JWT_ACCESS_TOKEN_TTL]"
    refresh_ttl: "[JWT_REFRESH_TOKEN_TTL]"
    issuer: "[JWT_ISSUER]"
